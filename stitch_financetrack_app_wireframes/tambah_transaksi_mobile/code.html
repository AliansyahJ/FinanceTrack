<script>
  // Micro-interactions & local state logic
  (function() {
    const input = document.getElementById('amount-input');
    const chipBtns = document.querySelectorAll('.chip-btn');
    const clearBtn = document.getElementById('clear-amount');
    const tabExpense = document.getElementById('tab-expense');
    const tabIncome = document.getElementById('tab-income');
    const tabTransfer = document.getElementById('tab-transfer');

    function formatNumber(n) {
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function parseAmount(val) {
      const clean = val.replace(/[^0-9]/g, '');
      return parseInt(clean, 10) || 0;
    }

    chipBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const addVal = parseInt(btn.dataset.val, 10);
        let curr = parseAmount(input.value);
        curr += addVal;
        input.value = formatNumber(curr);
      });
    });

    clearBtn.addEventListener('click', () => {
      input.value = "0";
      input.focus();
    });

    input.addEventListener('input', (e) => {
      let num = parseAmount(e.target.value);
      input.value = formatNumber(num);
    });

    // Tab Type Swapping Micro-Interaction
    const tabs = [
      { el: tabExpense, bg: 'bg-tertiary', text: 'text-on-tertiary' },
      { el: tabIncome, bg: 'bg-secondary', text: 'text-on-secondary' },
      { el: tabTransfer, bg: 'bg-primary-container', text: 'text-on-primary' }
    ];

    tabs.forEach(({ el, bg, text }) => {
      el.addEventListener('click', () => {
        tabs.forEach(t => {
          t.el.classList.remove('bg-tertiary', 'bg-secondary', 'bg-primary-container', 'text-on-tertiary', 'text-on-secondary', 'text-on-primary', 'shadow-sm');
          t.el.classList.add('text-on-surface-variant');
        });
        el.classList.remove('text-on-surface-variant');
        el.classList.add(bg, text, 'shadow-sm');
      });
    });
  })();
</script></main>
