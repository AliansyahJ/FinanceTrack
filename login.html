<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk · FinanceTrack</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(2, 132, 199, 0.08), transparent 70%), var(--bg);
      padding: var(--space-xl) var(--space-md);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: var(--space-2xl) var(--space-xl);
    }
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: var(--space-xl);
    }
    .auth-brand img {
      height: 38px;
      margin-bottom: var(--space-md);
    }
    .auth-tabs {
      display: flex;
      background: var(--surface-alt);
      padding: 4px;
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-xl);
    }
    .auth-tab {
      flex: 1;
      padding: var(--space-xs) var(--space-sm);
      text-align: center;
      font-weight: 600;
      font-size: var(--text-sm);
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .auth-tab.is-active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-xs);
    }
    .demo-box {
      background: rgba(2, 132, 199, 0.06);
      border: 1px dashed var(--primary);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      margin-bottom: var(--space-lg);
      font-size: var(--text-xs);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">
      <a href="index.html">
        <img src="assets/img/logo/logo.svg" alt="FinanceTrack" width="140" height="38">
      </a>
      <h1 class="page-title" id="authTitle" style="font-size:var(--text-xl);margin:0 0 var(--space-xs)">
        Selamat Datang Kembali
      </h1>
      <p class="page-subtitle" id="authSubtitle" style="font-size:var(--text-sm);margin:0">
        Masuk untuk mengelola keuangan harianmu
      </p>
    </div>

    <!-- Tab Pilihan Masuk / Daftar -->
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab is-active" id="tabLogin">Masuk</button>
      <button type="button" class="auth-tab" id="tabRegister">Daftar</button>
    </div>

    <div id="authAlert" class="callout callout--danger is-hidden" style="margin-bottom:var(--space-lg);padding:var(--space-sm) var(--space-md)">
      <span class="material-symbols-outlined callout__icon icon-sm" aria-hidden="true">error</span>
      <div id="authAlertText" style="font-size:var(--text-sm)"></div>
    </div>

    <!-- Demo Credentials Quick Fill -->
    <div class="demo-box" id="demoBox">
      <div>
        <strong style="color:var(--text)">Akun Demo:</strong><br>
        demo@financetrack.test / Demo123!
      </div>
      <button type="button" class="btn btn--secondary btn--sm" id="btnFillDemo" style="padding:4px 8px;font-size:11px">
        Pakai Akun Demo
      </button>
    </div>

    <!-- Form Login -->
    <form action="auth/login.php" method="POST" class="stack stack--md" id="loginForm">
      <div class="field">
        <label class="field__label" for="loginEmail">Email <span class="field__required">*</span></label>
        <div class="input-group">
          <span class="material-symbols-outlined icon-sm" aria-hidden="true">mail</span>
          <input type="email" name="email" id="loginEmail" class="input" required autocomplete="email" placeholder="nama@email.com">
        </div>
      </div>

      <div class="field">
        <div class="row row--between" style="margin-bottom:var(--space-xs)">
          <label class="field__label" for="loginPass" style="margin:0">Kata Sandi <span class="field__required">*</span></label>
        </div>
        <div class="input-group">
          <span class="material-symbols-outlined icon-sm" aria-hidden="true">lock</span>
          <input type="password" name="password" id="loginPass" class="input" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="btn btn--ghost btn--icon" id="toggleLoginPass" aria-label="Lihat kata sandi" style="padding:0 var(--space-xs)">
            <span class="material-symbols-outlined icon-sm">visibility</span>
          </button>
        </div>
      </div>

      <div class="row row--between" style="font-size:var(--text-xs)">
        <label style="display:inline-flex;align-items:center;gap:var(--space-xs);cursor:pointer">
          <input type="checkbox" name="remember" value="1" checked style="accent-color:var(--primary)">
          Ingat saya di perangkat ini
        </label>
      </div>

      <button type="submit" class="btn btn--primary btn--full" id="btnLoginSubmit" style="padding:var(--space-sm) var(--space-md);font-weight:600">
        <span class="material-symbols-outlined icon-sm" aria-hidden="true">login</span>
        Masuk ke FinanceTrack
      </button>
    </form>

    <!-- Form Register (Hidden by default) -->
    <form action="auth/register.php" method="POST" class="stack stack--md is-hidden" id="registerForm">
      <div class="field">
        <label class="field__label" for="regName">Nama Lengkap <span class="field__required">*</span></label>
        <div class="input-group">
          <span class="material-symbols-outlined icon-sm" aria-hidden="true">person</span>
          <input type="text" name="name" id="regName" class="input" required autocomplete="name" placeholder="Fikri Juana">
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="regEmail">Email <span class="field__required">*</span></label>
        <div class="input-group">
          <span class="material-symbols-outlined icon-sm" aria-hidden="true">mail</span>
          <input type="email" name="email" id="regEmail" class="input" required autocomplete="email" placeholder="fikri@kampus.ac.id">
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="regPass">Kata Sandi (Min. 6 Karakter) <span class="field__required">*</span></label>
        <div class="input-group">
          <span class="material-symbols-outlined icon-sm" aria-hidden="true">lock</span>
          <input type="password" name="password" id="regPass" class="input" required minlength="6" placeholder="Minimal 6 karakter">
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="regConfirm">Konfirmasi Kata Sandi <span class="field__required">*</span></label>
        <div class="input-group">
          <span class="material-symbols-outlined icon-sm" aria-hidden="true">lock_reset</span>
          <input type="password" name="confirm_password" id="regConfirm" class="input" required minlength="6" placeholder="Ulangi kata sandi">
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--full" id="btnRegSubmit" style="padding:var(--space-sm) var(--space-md);font-weight:600">
        <span class="material-symbols-outlined icon-sm" aria-hidden="true">person_add</span>
        Daftar Sekarang
      </button>
    </form>

    <div style="margin-top:var(--space-xl);text-align:center;font-size:var(--text-xs);color:var(--text-secondary)">
      <a href="index.html" style="color:var(--text-secondary);text-decoration:none;display:inline-flex;align-items:center;gap:4px">
        <span class="material-symbols-outlined icon-xs">arrow_back</span> Kembali ke Beranda
      </a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var tabLogin = document.getElementById("tabLogin");
      var tabRegister = document.getElementById("tabRegister");
      var loginForm = document.getElementById("loginForm");
      var registerForm = document.getElementById("registerForm");
      var demoBox = document.getElementById("demoBox");
      var title = document.getElementById("authTitle");
      var subtitle = document.getElementById("authSubtitle");
      var alertBox = document.getElementById("authAlert");
      var alertText = document.getElementById("authAlertText");

      function showAlert(msg) {
        if (!alertBox || !alertText) return;
        alertText.textContent = msg;
        alertBox.classList.remove("is-hidden");
      }
      function hideAlert() {
        if (alertBox) alertBox.classList.add("is-hidden");
      }

      tabLogin.addEventListener("click", function() {
        tabLogin.classList.add("is-active");
        tabRegister.classList.remove("is-active");
        loginForm.classList.remove("is-hidden");
        registerForm.classList.add("is-hidden");
        demoBox.classList.remove("is-hidden");
        title.textContent = "Selamat Datang Kembali";
        subtitle.textContent = "Masuk untuk mengelola keuangan harianmu";
        hideAlert();
      });

      tabRegister.addEventListener("click", function() {
        tabRegister.classList.add("is-active");
        tabLogin.classList.remove("is-active");
        loginForm.classList.add("is-hidden");
        registerForm.classList.remove("is-hidden");
        demoBox.classList.add("is-hidden");
        title.textContent = "Daftar Akun Baru";
        subtitle.textContent = "Kelola keuangan & uang saku mahasiswa dengan rapi";
        hideAlert();
      });

      var btnFill = document.getElementById("btnFillDemo");
      if (btnFill) {
        btnFill.addEventListener("click", function() {
          document.getElementById("loginEmail").value = "demo@financetrack.test";
          document.getElementById("loginPass").value = "Demo123!";
        });
      }

      var toggleBtn = document.getElementById("toggleLoginPass");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", function() {
          var pw = document.getElementById("loginPass");
          if (pw) {
            var isPass = pw.type === "password";
            pw.type = isPass ? "text" : "password";
            var icon = toggleBtn.querySelector(".material-symbols-outlined");
            if (icon) icon.textContent = isPass ? "visibility_off" : "visibility";
          }
        });
      }

      // Dukungan AJAX Login jika dijalankan di server
      loginForm.addEventListener("submit", function(e) {
        // Biarkan form POST standar berjalan jika action mengarah ke auth/login.php
      });
    });
  </script>
</body>
</html>
